<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VANDER - Gestiune Atelier</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --danger: #dc2626;
            --danger-bg: #ef4444;
            --success: #16a34a;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --radius: 12px;
            --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            --sidebar-bg: #111827;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html, body {
            min-height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding: 15px 10px;
        }

        button, input, select, textarea {
            font: inherit;
        }

        a {
            text-decoration: none;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
        }

        #sidebarOverlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.38);
            z-index: 999;
            display: none;
        }

        #sidebarOverlay.show {
            display: block;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -260px;
            width: 240px;
            height: 100vh;
            background: var(--sidebar-bg);
            color: #fff;
            z-index: 1000;
            transition: left 0.25s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 12px 0 28px rgba(15, 23, 42, 0.2);
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 18px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-brand {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .sidebar-user {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(15, 23, 42, 0.9);
        }

        .sidebar-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #cbd5e1;
        }

        .sidebar-user-name {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .sidebar-menu {
            list-style: none;
            padding: 10px 0;
            flex: 1;
            overflow-y: auto;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .sidebar-menu li a:hover,
        .sidebar-menu li.active a {
            background: rgba(148, 163, 184, 0.15);
            color: #fff;
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .sidebar-logout-btn {
            background: transparent;
            border: none;
            color: #f87171;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        .sidebar-logout-btn:hover {
            background: rgba(248, 113, 113, 0.08);
        }

        .app-header {
            position: relative;
            background: var(--card-bg);
            padding: 22px 20px 18px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 16px;
            text-align: center;
        }

        .logo-img {
            display: block;
            height: 42px;
            object-fit: contain;
            margin: 0 auto 8px;
        }

        .app-header h1 {
            font-size: clamp(1.2rem, 2vw, 1.55rem);
            font-weight: 800;
            color: var(--primary);
        }

        .app-header p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .menu-toggle-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #f1f5f9;
            border: 1px solid var(--border);
            color: var(--primary);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }

        .top-bar-btns {
            position: absolute;
            top: 15px;
            right: 15px;
        }

        .btn-outline {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: var(--danger);
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 4px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .card h2 {
            font-size: 1.08rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            background: #f8fafc;
            color: var(--text-main);
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .sizes-grid-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .size-box {
            flex: 1 1 40px;
            min-width: 40px;
            text-align: center;
            background: #fff;
            padding: 8px 6px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .size-box span {
            display: block;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .size-box input {
            width: 100%;
            text-align: center;
            padding: 4px;
            font-weight: 700;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: white;
        }

        .btn-primary {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #64748b;
            color: #fff;
            border: none;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
        }

        .import-box {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-input, .filter-select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            background: white;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }

        th, td {
            border-bottom: 1px solid var(--border);
            padding: 10px 8px;
            text-align: left;
            font-size: 0.82rem;
        }

        th {
            background: #f8fafc;
            color: var(--primary);
            font-weight: 700;
        }

        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .status.in-stock {
            background: rgba(22, 163, 74, 0.12);
            color: var(--success);
        }

        .status.low {
            background: rgba(234, 179, 8, 0.15);
            color: #a16207;
        }

        .status.out {
            background: rgba(220, 38, 38, 0.12);
            color: var(--danger);
        }

        .product-list {
            display: grid;
            gap: 18px;
        }

        .product-item {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 16px;
            background: rgba(255,255,255,0.3);
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 12px;
            padding: 12px;
        }

        .product-photo {
            background: linear-gradient(180deg, #f6f8fa, #e9edf2);
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 190px;
            overflow: hidden;
        }

        .product-photo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: drop-shadow(0 14px 18px rgba(0,0,0,0.15));
        }

        .product-body {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-title {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 52px;
            height: 28px;
            background: #3b82f6;
            border-radius: 8px;
            color: white;
            font-size: 0.85rem;
            font-weight: 800;
            padding: 0 10px;
            text-transform: lowercase;
        }

        .size-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 6px;
            max-width: 340px;
            margin-top: 8px;
        }

        .size-box-grid {
            height: 34px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: rgba(255,255,255,0.5);
            display: grid;
            place-items: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .size-box-grid.empty {
            background: rgba(148,163,184,0.08);
            color: var(--text-muted);
        }

        .inventory {
            margin-top: 14px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
        }

        .red-btn {
            margin-top: 12px;
            border: none;
            background: linear-gradient(180deg, #ff5f5f, #ed3e3e);
            color: white;
            border-radius: 8px;
            padding: 12px 14px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(220, 38, 38, 0.18);
            width: 100%;
            max-width: 300px;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(15, 23, 42, 0.08);
            font-weight: 700;
            color: var(--primary);
        }

        .meta-row .code {
            font-size: 1.1rem;
        }

        .form-shell {
            display: grid;
            gap: 10px;
        }

        .status-inline {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 4px;
        }

        .status-inline label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: none;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 700px) {
            .stats-grid,
            .form-row,
            .filter-row,
            .product-item {
                grid-template-columns: 1fr;
            }

            .app-header {
                padding-top: 54px;
            }

            .top-bar-btns {
                right: 10px;
            }

            .product-photo {
                min-height: 180px;
            }
        }
    </style>
</head>
<body>
    <div id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">VANDER</div>
            <button class="btn-outline" type="button" id="closeSidebarBtn">X</button>
        </div>

        <div class="sidebar-user">
            <img src="https://via.placeholder.com/36" alt="User" class="sidebar-avatar" />
            <div class="sidebar-user-name">Admin Atelier</div>
        </div>

        <ul class="sidebar-menu">
            <li class="active"><a href="#">Dashboard</a></li>
            <li><a href="#">Produse</a></li>
            <li><a href="#">Comenzi</a></li>
            <li><a href="#">Stocuri</a></li>
            <li><a href="#">Clienti</a></li>
            <li><a href="#">Facturi</a></li>
            <li><a href="#">Setări</a></li>
        </ul>

        <div class="sidebar-footer">
            <button class="sidebar-logout-btn" type="button">🡢 Deconectare</button>
        </div>
    </aside>

    <div class="container">
        <header class="app-header">
            <button class="menu-toggle-btn" id="menuToggleBtn" type="button">☰</button>
            <div class="top-bar-btns">
                <button class="btn-outline" type="button">LOGOUT</button>
            </div>
            <img class="logo-img" src="https://via.placeholder.com/150x40?text=VANDER" alt="VANDER logo" />
            <h1>Gestiune Atelier</h1>
            <p>Control complet al produselor, stocurilor și comenzilor</p>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalProductsStat">0</div>
                <div class="stat-label">Produse</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalOrdersStat">0</div>
                <div class="stat-label">Comenzi</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stockStat">0%</div>
                <div class="stat-label">Stoc disponibil</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="salesStat">€ 0</div>
                <div class="stat-label">Vânzări</div>
            </div>
        </section>

        <section class="card">
            <h2>Produse</h2>
            <div class="product-list" id="productList"></div>
        </section>

        <section class="card">
            <h2 id="formTitle">Adăugare produs</h2>

            <div class="form-shell">
                <div class="form-group">
                    <label for="numeProdus">Nume produs</label>
                    <input id="numeProdus" type="text" placeholder="ex: Ghete barbati din piele naturala" />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="codProdus">Cod produs</label>
                        <input id="codProdus" type="text" placeholder="ex: 20253" />
                    </div>
                    <div class="form-group">
                        <label for="pretProdus">Preț</label>
                        <input id="pretProdus" type="number" value="0" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="imageUrl">URL imagine</label>
                    <input id="imageUrl" type="text" placeholder="https://...jpg" />
                </div>

                <div class="form-group">
                    <label>Categorie</label>
                    <select id="categorieProdus">
                        <option value="Ghete/Botine/Cizme">Ghete/Botine/Cizme</option>
                        <option value="Pantofi">Pantofi</option>
                        <option value="Top Produse">Top Produse</option>
                        <option value="Toate Produsele">Toate Produsele</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Mărimi</label>
                    <div class="sizes-grid-container">
                        <div class="size-box"><span>39</span><input id="size39" type="number" value="0" /></div>
                        <div class="size-box"><span>40</span><input id="size40" type="number" value="0" /></div>
                        <div class="size-box"><span>41</span><input id="size41" type="number" value="0" /></div>
                        <div class="size-box"><span>42</span><input id="size42" type="number" value="0" /></div>
                        <div class="size-box"><span>43</span><input id="size43" type="number" value="0" /></div>
                        <div class="size-box"><span>44</span><input id="size44" type="number" value="0" /></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <div class="status-inline">
                        <label><input type="checkbox" id="topProduct" checked /> Top</label>
                        <label><input type="checkbox" id="activeProduct" checked /> Activ</label>
                    </div>
                </div>

                <div class="form-row">
                    <button id="saveProductBtn" class="btn-primary" type="button">Salvează produs</button>
                    <button id="newProductBtn" class="btn-secondary" type="button">Produs nou</button>
                </div>
            </div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import {
            getFirestore,
            collection,
            onSnapshot,
            setDoc,
            doc,
            deleteDoc,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const productListEl = document.getElementById("productList");
        const totalProductsStat = document.getElementById("totalProductsStat");
        const totalOrdersStat = document.getElementById("totalOrdersStat");
        const stockStat = document.getElementById("stockStat");
        const salesStat = document.getElementById("salesStat");

        const formTitle = document.getElementById("formTitle");
        const numeInput = document.getElementById("numeProdus");
        const codInput = document.getElementById("codProdus");
        const pretInput = document.getElementById("pretProdus");
        const imageUrlInput = document.getElementById("imageUrl");
        const categorieInput = document.getElementById("categorieProdus");
        const topProduct = document.getElementById("topProduct");
        const activeProduct = document.getElementById("activeProduct");
        const saveProductBtn = document.getElementById("saveProductBtn");
        const newProductBtn = document.getElementById("newProductBtn");

        let currentProductId = null;

        const sizeFields = [39, 40, 41, 42, 43, 44].reduce((acc, size) => {
            acc[size] = document.getElementById(`size${size}`);
            return acc;
        }, {});

        function getSizesFromForm() {
            const sizes = {};
            [39, 40, 41, 42, 43, 44].forEach(size => {
                sizes[String(size)] = Number(sizeFields[size].value || 0);
            });
            return sizes;
        }

        function computeTotal(sizes) {
            return Object.values(sizes).reduce((sum, value) => sum + Number(value || 0), 0);
        }

        function clearForm() {
            currentProductId = null;
            formTitle.textContent = "Adăugare produs";
            numeInput.value = "";
            codInput.value = "";
            pretInput.value = "0";
            imageUrlInput.value = "";
            categorieInput.value = "Ghete/Botine/Cizme";
            topProduct.checked = true;
            activeProduct.checked = true;
            [39, 40, 41, 42, 43, 44].forEach(size => sizeFields[size].value = 0);
        }

        function fillForm(product) {
            currentProductId = product.id;
            formTitle.textContent = "Editare produs";
            numeInput.value = product.nume || "";
            codInput.value = product.cod || "";
            pretInput.value = Number(product.pret || 0);
            imageUrlInput.value = product.imageUrl || "";
            categorieInput.value = product.categorie || "Ghete/Botine/Cizme";
            topProduct.checked = Boolean(product.top);
            activeProduct.checked = product.status !== "inactiv";
            [39, 40, 41, 42, 43, 44].forEach(size => {
                const value = product.sizes?.[String(size)] ?? 0;
                sizeFields[size].value = value;
            });
        }

        function buildProductPayload() {
            const sizes = getSizesFromForm();
            const payload = {
                nume: numeInput.value.trim(),
                cod: codInput.value.trim(),
                categorie: categorieInput.value,
                pret: Number(pretInput.value || 0),
                imageUrl: imageUrlInput.value.trim(),
                sizes,
                total: computeTotal(sizes),
                top: Boolean(topProduct.checked),
                status: activeProduct.checked ? "activ" : "inactiv",
                updatedAt: Date.now()
            };

            if (!payload.nume || !payload.cod) {
                alert("Completează numele și codul produsului.");
                return null;
            }

            return payload;
        }

        async function saveProduct() {
            const payload = buildProductPayload();
            if (!payload) return;

            const id = currentProductId || codInput.value.trim();
            const ref = doc(db, "produse", id);
            await setDoc(ref, { ...payload, id }, { merge: true });
            clearForm();
            alert("Produsul a fost salvat în Firebase.");
        }

        async function deleteProduct(productId) {
            if (!productId) return;
            const confirmed = confirm("Ștergi produsul din Firebase?");
            if (!confirmed) return;
            await deleteDoc(doc(db, "produse", productId));
        }

        async function toggleProductStatus(product) {
            const ref = doc(db, "produse", product.id);
            await updateDoc(ref, {
                status: product.status === "activ" ? "inactiv" : "activ",
                updatedAt: Date.now()
            });
        }

        function renderProduct(product) {
            const item = document.createElement("article");
            item.className = "product-item";

            const image = product.imageUrl || "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=80";
            const sizes = product.sizes || {};
            const sizeCells = [39, 40, 41, 42, 43, 44].map(size => {
                const value = sizes[String(size)] ?? 0;
                return `<div class="size-box-grid ${value === 0 ? "empty" : ""}">${value}</div>`;
            }).join("");

            const statusText = product.status === "inactiv" ? "Inactiv" : "Activ";

            item.innerHTML = `
                <div class="product-photo">
                    <img src="${image}" alt="${product.nume || "Produs"}" />
                </div>
                <div class="product-body">
                    <div class="product-title">
                        <span>${product.nume || "Produs nou"}</span>
                        ${product.top ? '<span class="tag">top</span>' : ""}
                    </div>

                    <div class="size-grid">${sizeCells}</div>

                    <div class="inventory">Total in inventar: ${product.total ?? 0} • ${statusText}</div>

                    <div style="display:flex; gap:10px; margin-top:12px; max-width:300px;">
                        <button class="red-btn" type="button" data-action="toggle" data-id="${product.id}">Opreste vanzarea</button>
                        <button class="btn-secondary" type="button" data-action="edit" data-id="${product.id}" style="flex:1; border-radius:8px;">Editează</button>
                    </div>

                    <div class="meta-row">
                        <span>${product.cod || "N/A"}</span>
                        <span class="code">${Number(product.pret || 0)} lei</span>
                    </div>
                </div>
            `;

            item.querySelector("[data-action='toggle']").addEventListener("click", async () => {
                await toggleProductStatus(product);
            });

            item.querySelector("[data-action='edit']").addEventListener("click", () => {
                fillForm(product);
                window.scrollTo({ top: 0, behavior: "smooth" });
            });

            return item;
        }

        function updateStats(products) {
            const activeProducts = products.filter(p => p.status !== "inactiv");
            totalProductsStat.textContent = String(activeProducts.length);
            totalOrdersStat.textContent = String(activeProducts.reduce((sum, p) => sum + (Number(p.total || 0) > 0 ? 1 : 0), 0));

            const totalStock = activeProducts.reduce((sum, p) => sum + Number(p.total || 0), 0);
            const stockPercent = activeProducts.length ? Math.min(100, Math.round((totalStock / Math.max(1, activeProducts.length * 20)) * 100)) : 0;
            stockStat.textContent = `${stockPercent}%`;

            const salesTotal = activeProducts.reduce((sum, p) => sum + Number(p.pret || 0), 0);
            salesStat.textContent = `€ ${salesTotal}`;
        }

        onSnapshot(collection(db, "produse"), (snapshot) => {
            const products = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
            productListEl.innerHTML = "";
            products.sort((a, b) => String(a.nume || "").localeCompare(String(b.nume || "")));
            products.forEach(product => productListEl.appendChild(renderProduct(product)));
            updateStats(products);
        }, (error) => {
            console.error("Firebase error:", error);
            productListEl.innerHTML = `<div class="card"><strong>Eroare Firebase:</strong> verifică config-ul din script.</div>`;
        });

        saveProductBtn.addEventListener("click", saveProduct);
        newProductBtn.addEventListener("click", clearForm);

        const sidebar = document.getElementById("sidebar");
        const sidebarOverlay = document.getElementById("sidebarOverlay");
        const menuToggleBtn = document.getElementById("menuToggleBtn");
        const closeSidebarBtn = document.getElementById("closeSidebarBtn");

        function openSidebar() {
            sidebar.classList.add("open");
            sidebarOverlay.classList.add("show");
        }

        function closeSidebar() {
            sidebar.classList.remove("open");
            sidebarOverlay.classList.remove("show");
        }

        menuToggleBtn.addEventListener("click", openSidebar);
        closeSidebarBtn.addEventListener("click", closeSidebar);
        sidebarOverlay.addEventListener("click", closeSidebar);

        clearForm();
    </script>
</body>
</html>
