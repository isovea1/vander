<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VANDER - Editare Produse</title>
  <style>
    :root {
      --bg-dark: #4a4d52;
      --bar-dark: rgba(18, 22, 26, 0.96);
      --screen-bg: #dfe0dc;
      --surface: rgba(255,255,255,0.32);
      --surface-2: rgba(255,255,255,0.2);
      --line: rgba(0,0,0,0.12);
      --text: #1c1d20;
      --muted: #6b7280;
      --blue: #2d8bfd;
      --green: #18b98a;
      --green-deep: #0f8e6d;
      --red: #ef4f4f;
      --red-deep: #cf3a3a;
      --yellow: #f6d365;
      --shadow: 0 16px 28px rgba(0,0,0,0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    html, body { height: 100%; background: var(--bg-dark); }
    body {
      display: grid;
      place-items: center;
      color: var(--text);
      overflow: hidden;
      padding: 0;
    }

    .phone {
      position: relative;
      width: 420px;
      height: 100vh;
      max-height: 920px;
      background: var(--screen-bg);
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.22);
    }

    .statusbar {
      height: 52px;
      background: var(--bar-dark);
      color: #f6f8fa;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .status-left, .status-right { display: flex; align-items: center; gap: 10px; }
    .signal { display: flex; align-items: end; gap: 3px; height: 14px; }
    .signal span {
      display: block;
      width: 3px;
      border-radius: 2px 2px 0 0;
      background: rgba(255,255,255,0.92);
    }
    .signal span:nth-child(1){ height: 4px; }
    .signal span:nth-child(2){ height: 7px; }
    .signal span:nth-child(3){ height: 9px; }
    .signal span:nth-child(4){ height: 12px; }

    .battery {
      width: 28px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 3px;
      position: relative;
      background: transparent;
    }
    .battery::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 16px;
      height: 4px;
      border-radius: 2px;
      background: #ebd765;
    }
    .battery::after {
      content: "";
      position: absolute;
      right: -4px;
      top: 2px;
      width: 2px;
      height: 5px;
      border-radius: 1px;
      background: rgba(255,255,255,0.9);
    }

    .network-badge {
      min-width: 32px;
      height: 20px;
      background: #f0d95a;
      color: #1d1d1f;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      padding: 0 8px;
    }

    .topbar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      background: rgba(0,0,0,0.05);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px 12px;
      font-weight: 800;
      font-size: 17px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .hamburger { width: 22px; height: 18px; position: relative; display: inline-block; }
    .hamburger span {
      position: absolute;
      left: 0;
      width: 100%;
      height: 3px;
      background: #1e2125;
      border-radius: 2px;
    }
    .hamburger span:nth-child(1){ top: 0; }
    .hamburger span:nth-child(2){ top: 7px; }
    .hamburger span:nth-child(3){ top: 14px; }

    .content {
      height: calc(100vh - 52px - 48px - 120px);
      overflow-y: auto;
      padding: 0 12px 12px;
      scrollbar-width: none;
    }
    .content::-webkit-scrollbar { display: none; }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.45);
    }

    .product-layout {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 10px;
      align-items: start;
    }

    .shoe-box {
      height: 150px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,0.24), rgba(255,255,255,0.08));
      border: 1px solid rgba(0,0,0,0.05);
    }
    .shoe-box img {
      width: 125%;
      height: 100%;
      object-fit: cover;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.12));
      transform: scale(1.18);
      background: transparent;
    }

    .field-group {
      display: grid;
      gap: 8px;
      margin-bottom: 8px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .field-row label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .product-input,
    .product-price,
    .product-code,
    .size-input {
      width: 100%;
      border: 1px solid rgba(0,0,0,0.15);
      background: rgba(255,255,255,0.42);
      border-radius: 8px;
      padding: 8px 9px;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }

    .product-input {
      font-size: 14px;
      font-weight: 700;
    }

    .product-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
    }

    .size-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 6px;
      margin-top: 2px;
    }

    .size-box {
      border: 1px solid rgba(0,0,0,0.14);
      background: rgba(255,255,255,0.34);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 68px;
      padding: 4px 2px;
    }

    .size-box span {
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .size-box input {
      width: 100%;
      border: none;
      background: transparent;
      text-align: center;
      font-weight: 800;
      font-size: 13px;
      color: var(--text);
      outline: none;
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(0,0,0,0.08);
      font-size: 14px;
      font-weight: 700;
      color: #1f2125;
    }

    .meta-row .price {
      min-width: 60px;
      text-align: right;
      font-size: 15px;
    }

    .toggle-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      min-width: 52px;
      height: 28px;
      border-radius: 999px;
      background: rgba(0,0,0,0.12);
      padding: 4px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .switch::before {
      content: "";
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transform: translateX(0);
      transition: transform 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .switch.active {
      background: var(--green);
    }
    .switch.active::before { transform: translateX(24px); }

    .action-bar {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid rgba(0,0,0,0.08);
      background: rgba(255,255,255,0.18);
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.2s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn.primary {
      background: linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%);
      color: white;
      box-shadow: 0 4px 0 rgba(12, 127, 103, 0.24);
      flex: 1;
    }
    .btn.secondary {
      background: linear-gradient(180deg, var(--blue) 0%, #1e6ee8 100%);
      color: white;
      box-shadow: 0 4px 0 rgba(18, 63, 154, 0.24);
      flex: 1;
    }
    .btn.danger {
      background: linear-gradient(180deg, var(--red) 0%, var(--red-deep) 100%);
      color: white;
      box-shadow: 0 4px 0 rgba(153, 43, 43, 0.24);
    }

    .login-overlay {
      position: absolute;
      inset: 0;
      background: rgba(17, 18, 20, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
      backdrop-filter: blur(2px);
    }

    .login-box {
      width: min(86%, 300px);
      background: rgba(255,255,255,0.95);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 20px 18px 16px;
    }

    .login-box h2 {
      text-align: center;
      font-size: 18px;
      margin-bottom: 14px;
      color: #1f2937;
    }

    .login-form {
      display: grid;
      gap: 12px;
    }

    .login-form input {
      width: 100%;
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      background: #f9fafb;
      color: #111827;
    }

    .login-form button {
      border: none;
      border-radius: 10px;
      padding: 11px 12px;
      background: linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%);
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .hidden { display: none !important; }

    @media (max-width: 420px) {
      .phone { width: 100vw; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="login-overlay" id="loginOverlay">
      <div class="login-box">
        <h2>Autentificare</h2>
        <form class="login-form" id="loginForm">
          <input type="password" id="loginPassword" placeholder="Introdu codul de acces" autocomplete="off" required />
          <button type="submit">Intră în aplicație</button>
        </form>
      </div>
    </div>

    <div id="appMainContent">
      <div class="statusbar">
        <div class="status-left">
          <span>08:52</span>
          <span style="font-size: 18px;">◔</span>
        </div>
        <div class="status-right">
          <div class="signal" aria-label="signal">
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="battery" aria-label="battery"></div>
          <span class="network-badge">17</span>
        </div>
      </div>

      <div class="topbar">supp.ssell.ro</div>

      <div class="title-row">
        <div class="hamburger" aria-label="menu">
          <span></span><span></span><span></span>
        </div>
        <div>Toate produsele</div>
      </div>

      <div class="content" id="productList"></div>

      <div class="action-bar">
        <button class="btn secondary" id="addProductBtn" type="button">+ Adaugă produs</button>
        <button class="btn primary" id="saveProductsBtn" type="button">Salvează</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDdI_ae-3iwkgxk9I-OMhgw_2OA3WtLwn8",
      authDomain: "vander-9e026.firebaseapp.com",
      databaseURL: "https://vander-9e026-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "vander-9e026",
      storageBucket: "vander-9e026.firebasestorage.app",
      messagingSenderId: "317349329202",
      appId: "1:317349329202:web:68ed0cdf0f75637801bf2b"
    };

    const AUTH_KEY = 'vander_is_logged';
    const standardSizes = [39, 40, 41, 42, 43, 44, 45];
    const DEFAULT_PRODUCTS = [
      {
        id: 'F104N',
        name: 'Ghete bărbați din piele naturală',
        code: 'F104N',
        color: 'Negru',
        price: 160,
        image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=80',
        active: true,
        sizes: {39: 2, 40: 3, 41: 4, 42: 3, 43: 2, 44: 1, 45: 0}
      },
      {
        id: '4052N',
        name: 'Pantofi bărbați din piele naturală',
        code: '4052N',
        color: 'Negru',
        price: 135,
        image: 'https://images.unsplash.com/photo-1543163521-1bf539c55dd2?auto=format&fit=crop&w=900&q=80',
        active: true,
        sizes: {39: 1, 40: 2, 41: 2, 42: 3, 43: 2, 44: 1, 45: 0}
      },
      {
        id: '20255',
        name: 'Pantofi casual premium',
        code: '20255',
        color: 'Negru',
        price: 149,
        image: 'https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?auto=format&fit=crop&w=900&q=80',
        active: true,
        sizes: {39: 0, 40: 2, 41: 4, 42: 2, 43: 3, 44: 2, 45: 1}
      }
    ];

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const productsRef = ref(db, 'vander_produse');

    let products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));

    const loginOverlay = document.getElementById('loginOverlay');
    const appMainContent = document.getElementById('appMainContent');
    const loginForm = document.getElementById('loginForm');
    const productList = document.getElementById('productList');
    const addProductBtn = document.getElementById('addProductBtn');
    const saveProductsBtn = document.getElementById('saveProductsBtn');

    function normalizeSizes(rawSizes = {}) {
      const normalized = {};
      standardSizes.forEach((size) => {
        const value = Array.isArray(rawSizes)
          ? Number(rawSizes[standardSizes.indexOf(size)] || 0)
          : Number(rawSizes[size] || 0);
        normalized[size] = Number.isFinite(value) ? value : 0;
      });
      return normalized;
    }

    function normalizeProduct(product, index = 0) {
      const normalized = {
        id: product.id || `prod-${Date.now()}-${index}`,
        name: product.name || `Produs ${index + 1}`,
        code: product.code || `COD-${index + 1}`,
        color: product.color || 'Negru',
        price: Number(product.price || 0),
        image: product.image || 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=80',
        active: product.active !== false,
        sizes: normalizeSizes(product.sizes || {})
      };
      return normalized;
    }

    function getTotalStock(product) {
      return Object.values(product.sizes || {}).reduce((sum, count) => sum + Number(count || 0), 0);
    }

    function renderProducts() {
      productList.innerHTML = products.map((product, index) => {
        const amount = getTotalStock(product);
        return `
          <article class="product-card" data-index="${index}">
            <div class="product-layout">
              <div class="shoe-box">
                <img src="${product.image}" alt="${product.name}" />
              </div>

              <div>
                <div class="field-group">
                  <div class="field-row">
                    <label>Nume</label>
                  </div>
                  <input class="product-input" data-field="name" data-index="${index}" value="${escapeHtml(product.name)}" />
                </div>

                <div class="field-group">
                  <div class="field-row">
                    <label>Cod</label>
                    <span style="font-size:11px; color: var(--muted); font-weight:800;">${amount} buc.</span>
                  </div>
                  <input class="product-code" data-field="code" data-index="${index}" value="${escapeHtml(product.code)}" />
                </div>

                <div class="field-group">
                  <div class="field-row">
                    <label>Preț</label>
                    <span style="font-size:11px; color: var(--muted); font-weight:800;">Lei</span>
                  </div>
                  <input class="product-price" type="number" min="0" data-field="price" data-index="${index}" value="${Number(product.price || 0)}" />
                </div>
              </div>
            </div>

            <div class="product-row">
              <span>${product.color || 'Negru'}</span>
              <span style="color:#111827;">ID: ${product.id}</span>
            </div>

            <div class="size-grid">
              ${standardSizes.map((size) => `
                <div class="size-box">
                  <span>${size}</span>
                  <input type="number" min="0" data-size="${size}" data-index="${index}" value="${Number(product.sizes[size] || 0)}" />
                </div>
              `).join('')}
            </div>

            <div class="toggle-wrap">
              <span style="font-size:12px; font-weight:800; text-transform: uppercase; color: var(--muted);">Disponibil</span>
              <button class="switch ${product.active ? 'active' : ''}" data-toggle="active" data-index="${index}" type="button" aria-label="Toggle disponibil"></button>
            </div>

            <div class="meta-row">
              <span>Stoc total</span>
              <span class="price">${amount}</span>
            </div>
          </article>
        `;
      }).join('');

      document.querySelectorAll('[data-field]').forEach((input) => {
        input.addEventListener('input', (event) => {
          const index = Number(event.target.dataset.index);
          const field = event.target.dataset.field;
          if (!products[index]) return;

          if (field === 'price') {
            products[index][field] = Number(event.target.value || 0);
          } else {
            products[index][field] = event.target.value;
          }
        });
      });

      document.querySelectorAll('[data-size]').forEach((input) => {
        input.addEventListener('input', (event) => {
          const index = Number(event.target.dataset.index);
          const size = Number(event.target.dataset.size);
          if (!products[index]) return;
          products[index].sizes[size] = Number(event.target.value || 0);
          renderProducts();
        });
      });

      document.querySelectorAll('[data-toggle]').forEach((button) => {
        button.addEventListener('click', (event) => {
          const index = Number(event.target.dataset.index);
          if (!products[index]) return;
          products[index].active = !products[index].active;
          renderProducts();
        });
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function saveProductsToFirebase() {
      const safeProducts = products.map((product, index) => normalizeProduct(product, index));
      set(productsRef, safeProducts)
        .then(() => {
          products = safeProducts;
          renderProducts();
        })
        .catch((error) => {
          console.error('Eroare la salvarea în Firebase:', error);
          alert('A apărut o eroare la salvarea datelor. Verifică configurația Firebase.');
        });
    }

    function addProduct() {
      const newProduct = {
        id: `prod-${Date.now()}`,
        name: 'Produs nou',
        code: `NEW-${products.length + 1}`,
        color: 'Negru',
        price: 0,
        image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=80',
        active: true,
        sizes: {39: 0, 40: 0, 41: 0, 42: 0, 43: 0, 44: 0, 45: 0}
      };
      products.push(newProduct);
      renderProducts();
      saveProductsToFirebase();
    }

    function isLoggedIn() {
      return localStorage.getItem(AUTH_KEY) === 'true';
    }

    function setLoggedIn(flag) {
      localStorage.setItem(AUTH_KEY, flag ? 'true' : 'false');
      loginOverlay.classList.toggle('hidden', flag);
      appMainContent.classList.toggle('hidden', !flag);
    }

    function initAuth() {
      const password = '1234';
      loginForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const entered = document.getElementById('loginPassword').value;
        if (entered === password) {
          setLoggedIn(true);
          document.getElementById('loginPassword').value = '';
          syncFromFirebase();
        } else {
          alert('Cod incorect. Folosește 1234 pentru demo.');
        }
      });
    }

    function syncFromFirebase() {
      onValue(productsRef, (snapshot) => {
        const data = snapshot.val();
        if (Array.isArray(data) && data.length) {
          products = data.map(normalizeProduct);
        } else if (data && typeof data === 'object') {
          products = Object.values(data).map(normalizeProduct);
        } else {
          products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
        }
        renderProducts();
      }, {
        onlyOnce: false
      });
    }

    loginForm.addEventListener('submit', (event) => event.preventDefault());
    addProductBtn.addEventListener('click', addProduct);
    saveProductsBtn.addEventListener('click', saveProductsToFirebase);

    initAuth();
    setLoggedIn(isLoggedIn());
    syncFromFirebase();
  </script>
</body>
</html>
