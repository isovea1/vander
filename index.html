<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANDER - Gestiune Atelier</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --danger: #dc2626;
            --danger-bg: #ef4444;
            --success: #16a34a;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --radius: 10px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --sidebar-bg: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding: 15px 10px; line-height: 1.5; }
        .container { max-width: 900px; margin: 0 auto; }

        #sidebarOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 999; display: none; }
        .sidebar { position: fixed; top: 0; left: -240px; width: 240px; height: 100%; background: var(--sidebar-bg); color: #fff; z-index: 1000; transition: left 0.3s ease; display: flex; flex-direction: column; }
        .sidebar.open { left: 0; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; }
        .sidebar-brand { font-size: 1.05rem; font-weight: 800; letter-spacing: 0.5px; }
        .sidebar-user { padding: 15px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #334155; background: #0f172a; }
        .sidebar-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #cbd5e1; }
        .sidebar-user-name { font-size: 0.85rem; font-weight: 600; }
        .sidebar-menu { list-style: none; padding: 8px 0; flex-grow: 1; overflow-y: auto; }
        .sidebar-menu li a { display: flex; align-items: center; gap: 10px; padding: 11px 16px; color: #cbd5e1; text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: background 0.2s, color 0.2s; }
        .sidebar-menu li a:hover, .sidebar-menu li.active a { background: #334155; color: #fff; }
        .sidebar-footer { padding: 12px 16px; border-top: 1px solid #334155; }
        .sidebar-logout-btn { background: transparent; border: none; color: #f87171; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; width: 100%; padding: 8px; border-radius: 6px; }
        .sidebar-logout-btn:hover { background: rgba(248, 113, 113, 0.1); }

        .app-header { background: var(--card-bg); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; margin-bottom: 16px; border: 1px solid var(--border); position: relative; }
        .logo-img { height: 40px; object-fit: contain; margin-bottom: 8px; }
        .app-header h1 { font-size: 1.3rem; font-weight: 800; color: var(--primary); }
        .app-header p { color: var(--text-muted); font-size: 0.8rem; }
        .menu-toggle-btn { position: absolute; top: 15px; left: 15px; background: #f1f5f9; border: 1px solid var(--border); color: var(--primary); padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .top-bar-btns { position: absolute; top: 15px; right: 15px; }
        .btn-outline { background: #fef2f2; border: 1px solid #fecaca; color: var(--danger); padding: 5px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 600; cursor: pointer; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .stat-card { background: var(--card-bg); padding: 15px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); text-align: center; }
        .stat-number { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; }

        .card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .card h2 { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-bottom: 15px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--primary); margin-bottom: 5px; text-transform: uppercase; }
        input[type="text"], input[type="password"], input[type="number"], select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; background: #f8fafc; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); background: #fff; }

        .sizes-grid-container { display: flex; gap: 6px; flex-wrap: wrap; background: #f8fafc; padding: 10px; border-radius: 6px; border: 1px solid var(--border); }
        .size-box { text-align: center; background: white; padding: 6px; border-radius: 4px; border: 1px solid var(--border); flex: 1; min-width: 40px; }
        .size-box span { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 2px; }
        .size-box input { width: 100%; text-align: center; padding: 4px; font-weight: 700; font-size: 0.85rem; border: 1px solid var(--border); border-radius: 4px; }

        .btn-primary { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #64748b; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 0.90rem; font-weight: 700; cursor: pointer; }

        .import-box { background: #f8fafc; padding: 12px; border-radius: 6px; border: 1px dashed var(--border); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        .filter-row { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-bottom: 15px; }
        .search-input, .filter-select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; background: #f8fafc; }
