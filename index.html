<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VANDER - Autentificare</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --success: #16a34a;
      --border: #cbd5e1;
      --muted: #64748b;
      --shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--primary);
    }

    .hidden { display: none !important; }

    #loginOverlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .login-card {
      width: min(420px, calc(100% - 30px));
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 32px 24px;
      text-align: center;
    }

    .login-card h2 {
      margin: 0 0 20px;
      font-size: 1.5rem;
    }

    .login-card label {
      display: block;
      text-align: left;
      margin-bottom: 8px;
      font-weight: 700;
      color: var(--primary);
    }

    .login-card input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    .login-card input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-outline {
      background: white;
      border: 1px solid var(--border);
      color: var(--primary);
    }

    .error {
      margin-top: 12px;
      min-height: 20px;
      color: var(--danger);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .app-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 18px 48px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .brand {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .user-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-pill {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      padding: 8px 12px;
      color: #1d4ed8;
      font-weight: 700;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .stat .label {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    .stat .value {
      font-size: 2rem;
      font-weight: 800;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 24px;
    }

    .panel h3 {
      margin-top: 0;
      margin-bottom: 16px;
    }

    .product-list {
      display: grid;
      gap: 12px;
    }

    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f8fafc;
    }

    .product-name {
      font-weight: 700;
    }

    .stock {
      display: inline-block;
      background: #dcfce7;
      border: 1px solid #bbf7d0;
      color: #166534;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 999px;
      min-width: 110px;
      text-align: center;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div id="loginOverlay">
    <div class="login-card">
      <img src="logo.png" alt="VANDER" style="height: 42px; margin-bottom: 12px;" onerror="this.style.display='none'" />
      <h2>Autentificare Atelier</h2>
      <form id="loginForm" novalidate>
        <div>
          <label for="loginUser">Utilizator</label>
          <input id="loginUser" type="text" placeholder="ex: vander" required />
        </div>
        <div>
          <label for="loginPass">Parolă</label>
          <input id="loginPass" type="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary">Intră în Aplicație</button>
        <div id="loginError" class="error" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <div id="appShell" class="app-shell hidden">
    <header class="topbar">
      <div class="brand">VANDER - Gestiune Atelier</div>
      <div class="user-meta">
        <span class="user-pill" id="userBadge">Administrator</span>
        <button id="logoutBtn" class="btn btn-outline" type="button">Ieșire</button>
      </div>
    </header>

    <section class="stats">
      <div class="stat">
        <div class="label">Modele</div>
        <div class="value" id="statModels">12</div>
      </div>
      <div class="stat">
        <div class="label">Total perechi</div>
        <div class="value" id="statPieces">248</div>
      </div>
      <div class="stat">
        <div class="label">Stare</div>
        <div class="value" style="font-size:1.3rem; color: var(--success);">Online</div>
      </div>
    </section>

    <section class="panel">
      <h3>Produse</h3>
      <div class="product-list" id="productList">
        <div class="product-item">
          <span class="product-name">Pantofi Sport A1</span>
          <span class="stock">42 buc.</span>
        </div>
        <div class="product-item">
          <span class="product-name">Pantofi Eleganți B2</span>
          <span class="stock">18 buc.</span>
        </div>
        <div class="product-item">
          <span class="product-name">Cizme C3</span>
          <span class="stock">31 buc.</span>
        </div>
      </div>
    </section>
  </div>

  <script>
    const VALID_USERS = {
      vander: 'vander',
      admin: '1234',
      madalin: 'madalin123'
    };

    const loginOverlay = document.getElementById('loginOverlay');
    const appShell = document.getElementById('appShell');
    const loginForm = document.getElementById('loginForm');
    const loginUser = document.getElementById('loginUser');
    const loginPass = document.getElementById('loginPass');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');
    const userBadge = document.getElementById('userBadge');

    function isLoggedIn() {
      return localStorage.getItem('vanderAuth') === 'true';
    }

    function setLoggedIn(username) {
      localStorage.setItem('vanderAuth', 'true');
      localStorage.setItem('vanderUser', username);
      userBadge.textContent = username.toUpperCase();
    }

    function logout() {
      localStorage.removeItem('vanderAuth');
      localStorage.removeItem('vanderUser');
      loginOverlay.classList.remove('hidden');
      appShell.classList.add('hidden');
      loginForm.reset();
      loginError.textContent = '';
      loginUser.focus();
    }

    function renderApp() {
      const storedUser = localStorage.getItem('vanderUser') || 'ADMIN';
      userBadge.textContent = storedUser.toUpperCase();
      loginOverlay.classList.add('hidden');
      appShell.classList.remove('hidden');
    }

    loginForm.addEventListener('submit', function (event) {
      event.preventDefault();
      const username = loginUser.value.trim();
      const password = loginPass.value.trim();

      if (!username || !password) {
        loginError.textContent = 'Completează utilizatorul și parola.';
        return;
      }

      const storedPassword = VALID_USERS[username.toLowerCase()];

      if (storedPassword && storedPassword === password) {
        setLoggedIn(username);
        renderApp();
        return;
      }

      loginError.textContent = 'Date de autentificare incorecte. Încearcă: vander / vander';
      loginPass.value = '';
      loginPass.focus();
    });

    logoutBtn.addEventListener('click', logout);

    if (isLoggedIn()) {
      renderApp();
    }
  </script>
</body>
</html>
